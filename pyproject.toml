[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tranchee3d"
version = "0.1.0"
description = "Détection 3D de câbles et d'ouvrages en tranchée ouverte"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "laspy[lazrs]",
    "rasterio",
    "shapely",
    "scikit-image",
    "pillow",
    "torch",
    "segmentation-models-pytorch",
    "onnx",
    "onnxruntime",
    "psutil",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tranchee3d = ["assets/*"]
